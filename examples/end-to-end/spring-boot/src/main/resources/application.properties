# Every value comes from the environment (see .env.example). Nothing secret lives in this file.

# Read by the Clikgate starter: it creates the Clikgate bean from these.
clikgate.api-key=${CLIKGATE_API_KEY}
# Only for a local fake of the API (the tests use one); the real API is the default.
clikgate.base-url=${CLIKGATE_BASE_URL:https://api.clikgate.com}
# Optional. Without it, sign-in responses carry no identity token and the app uses the installation header instead.
clikgate.identity-secret=${CLIKGATE_IDENTITY_SECRET:}

# Read by this sample's own code (our own prefix: "clikgate." belongs to the starter).
sample.webhook-secret=${CLIKGATE_WEBHOOK_SECRET}
sample.referral-program-id=${CLIKGATE_REFERRAL_PROGRAM_ID}

server.port=${PORT:8080}
