# Publish Clikgate and Clikgate.AspNetCore to NuGet.org on tags server-dotnet-v<semver> (S.17), with NuGet trusted
# publishing (OIDC: NuGet/login exchanges the GitHub token for a 1-hour API key; no long-lived key), symbols
# (.snupkg) and a CycloneDX SBOM attached to the GitHub release. NuGet side (docs/SERVER_SDKS.md): a trusted
# publishing policy for owner clikgate, repository clikgate-sdks, workflow server-dotnet-release.yml, environment
# nuget; the secret NUGET_USER is the nuget.org profile name.
name: server-dotnet-release

on:
  push:
    tags: ["server-dotnet-v*"]

permissions:
  contents: read

concurrency:
  group: server-dotnet-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: scripts/check-version.sh
      - run: dotnet build Clikgate.sln -c Release "-p:TestTfms=net8.0;net10.0"
      - run: dotnet test --project tests/Clikgate.Tests -c Release --no-build "-p:TestTfms=net8.0;net10.0"
      - run: dotnet run --project tests/Clikgate.Conformance -c Release --no-build
      - run: dotnet pack src/Clikgate -c Release -o artifacts
      - run: dotnet pack src/Clikgate.AspNetCore -c Release -o artifacts
      - name: Release scan (fails the release on internal comments, TODO notes, debug code, internal or staff URLs)
        run: node ../scripts/scan-package.mjs artifacts/*.nupkg artifacts/*.snupkg README.md CHANGELOG.md
      - run: dotnet tool restore
      - name: CycloneDX SBOMs
        run: |
          v="${GITHUB_REF_NAME#server-dotnet-v}"
          dotnet CycloneDX src/Clikgate/Clikgate.csproj -F Json -spv 1.6 -ed -o sbom -fn "clikgate-dotnet-$v.cdx.json"
          dotnet CycloneDX src/Clikgate.AspNetCore/Clikgate.AspNetCore.csproj -F Json -spv 1.6 -ed -o sbom -fn "clikgate-aspnetcore-$v.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: server/dotnet/artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: server/dotnet/sbom/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    environment: nuget
    permissions:
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages and symbols (the key lives one hour)
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOMs to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: GitHub release with the SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#server-dotnet-v}"
          gh release create "$GITHUB_REF_NAME" --title "Clikgate (.NET) $v" \
            --notes "See server/dotnet/CHANGELOG.md. Published to NuGet.org with trusted publishing: Clikgate and Clikgate.AspNetCore." \
            sbom/*.cdx.json
