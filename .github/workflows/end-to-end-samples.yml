# End-to-end sample backends (examples/end-to-end): each one is built against the SDK in this repository and runs
# its flow test (sign-up to a paid referral reward) against a local fake of the Clikgate API. No job calls the real
# API, and no job needs a secret.
name: end-to-end-samples

on:
  push:
    branches: [main]
    paths: ["examples/end-to-end/**", "server/**", ".github/workflows/end-to-end-samples.yml"]
  pull_request:
    paths: ["examples/end-to-end/**", "server/**", ".github/workflows/end-to-end-samples.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: end-to-end-samples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot:
    name: Spring Boot 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Install the SDK and the starter from this repository
        run: mvn -B -ntp -q -f server/java/pom.xml install -DskipTests
      - name: Build and test the sample
        run: mvn -B -ntp -f examples/end-to-end/spring-boot/pom.xml verify

  node-express:
    name: Node.js (Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the SDK from this repository
        working-directory: server/node
        run: npm ci && npm run build
      - name: Typecheck and test the sample
        working-directory: examples/end-to-end/node-express
        run: |
          npm ci
          npm run typecheck
          npm test

  python-fastapi:
    name: Python (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/end-to-end/python-fastapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the sample (and the SDK from this repository)
        run: pip install -r requirements-dev.txt
      - name: Test the sample
        run: python -m pytest

  php-slim:
    name: PHP (Slim, PSR-15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/end-to-end/php-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: curl
          coverage: none
      - name: Install the sample (and link the SDK from this repository)
        run: composer install --no-interaction --no-progress
      - name: Test the sample
        run: composer test

  dotnet-minimal-api:
    name: .NET (minimal API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/end-to-end/dotnet-minimal-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and test the sample (and the SDK from this repository)
        run: dotnet test --project tests/Sample.Tests
