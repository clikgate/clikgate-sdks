# Server SDK for .NET (server/dotnet): build with warnings as errors (netstandard2.0, net8.0, net10.0), unit
# tests, the cross-language conformance suite and the ASP.NET Core add-on, on .NET 8 and 10 (Linux and Windows)
# plus .NET Framework 4.7.2 on Windows for the netstandard2.0 build. Support checked 2026-10-26 (docs/DECISIONS.md):
# .NET 8 and 9 reach end of support on 2026-11-10; .NET 10 (LTS) runs to 2028-11-14.
name: server-dotnet

on:
  push:
    branches: [main]
    paths: ["server/dotnet/**", "server/conformance/**", "server/SPEC.md", ".github/workflows/server-dotnet.yml"]
  pull_request:
    paths: ["server/dotnet/**", "server/conformance/**", "server/SPEC.md", ".github/workflows/server-dotnet.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tfms: "net8.0;net10.0" }
          - { os: windows-latest, tfms: "net472;net8.0;net10.0" }
    defaults:
      run:
        working-directory: server/dotnet
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: scripts/check-version.sh
      - name: Build (warnings are errors)
        run: dotnet build Clikgate.sln -c Release "-p:TestTfms=\"${{ matrix.tfms }}\""
      - name: Format
        if: runner.os == 'Linux'
        run: dotnet format Clikgate.sln --verify-no-changes
      - name: Unit tests
        run: dotnet test --project tests/Clikgate.Tests -c Release --no-build "-p:TestTfms=\"${{ matrix.tfms }}\""
      - name: Conformance suite
        run: dotnet run --project tests/Clikgate.Conformance -c Release --no-build

  pack:
    name: pack and SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: dotnet pack src/Clikgate -c Release -o artifacts
      - run: dotnet pack src/Clikgate.AspNetCore -c Release -o artifacts
      # ContinuousIntegrationBuild (Directory.Build.props, on GitHub Actions) maps source paths to /_/ in the pdbs
      - name: Release scan (no internal comments, TODO notes, debug code, internal or staff URLs)
        run: node ../scripts/scan-package.mjs artifacts/*.nupkg artifacts/*.snupkg README.md CHANGELOG.md
      - run: dotnet tool restore
      - run: dotnet CycloneDX src/Clikgate/Clikgate.csproj -F Json -spv 1.6 -ed -o artifacts -fn clikgate.cdx.json
