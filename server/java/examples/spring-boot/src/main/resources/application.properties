clikgate.api-key=${CLIKGATE_API_KEY}
# background (default) or sync; auto (default), true or false
clikgate.send-mode=background
clikgate.private-mode=auto
clikgate.cookie.days=30
# POST /cg/keep for the web script's data-server-endpoint="/cg/keep" (off by default; same host as the website)
clikgate.keep-route.enabled=true
